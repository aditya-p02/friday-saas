version: '3.8'

services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: friday_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n_friday
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=Asia/Kolkata
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres

  api:
    build: .
    container_name: friday_api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - TRANSFORMERS_CACHE=/app/model_cache
    volumes:
      - model_cache:/app/model_cache
    depends_on:
      - postgres

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: friday_dashboard
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api

volumes:
  n8n_data:
  postgres_data:
  model_cache: