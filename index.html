<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRIDAY | Connect With Us</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center h-screen">

    <div class="bg-gray-800 p-8 rounded-lg shadow-lg w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-center text-blue-400">Project Inquiry</h2>
        
        <form id="leadForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Name</label>
                <input type="text" id="name" required class="w-full p-2 bg-gray-700 rounded border border-gray-600 focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Email</label>
                <input type="email" id="email" required class="w-full p-2 bg-gray-700 rounded border border-gray-600 focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Phone</label>
                <input type="tel" id="phone" required class="w-full p-2 bg-gray-700 rounded border border-gray-600 focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Company</label>
                <input type="text" id="company" class="w-full p-2 bg-gray-700 rounded border border-gray-600 focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Message / Project Details</label>
                <textarea id="message" rows="3" required class="w-full p-2 bg-gray-700 rounded border border-gray-600 focus:outline-none focus:border-blue-500"></textarea>
            </div>
            
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition duration-200">
                Send to FRIDAY
            </button>
        </form>
        
        <div id="status" class="mt-4 text-center text-sm hidden"></div>
    </div>

    <script>
        document.getElementById('leadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const statusDiv = document.getElementById('status');
            const submitBtn = e.target.querySelector('button');
            
            // PUT YOUR N8N PRODUCTION URL HERE
            const WEBHOOK_URL = "http://localhost:5678/webhook/71c5c87e-04e8-411c-a387-7d1b8f72131f";
            
            const payload = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                company: document.getElementById('company').value,
                message: document.getElementById('message').value
            };

            submitBtn.textContent = "Analyzing...";
            submitBtn.disabled = true;

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    statusDiv.textContent = "✅ Lead successfully submitted!";
                    statusDiv.className = "mt-4 text-center text-sm text-green-400 block";
                    e.target.reset();
                } else {
                    throw new Error('Network response was not ok');
                }
            } catch (error) {
                statusDiv.textContent = "❌ Error submitting form.";
                statusDiv.className = "mt-4 text-center text-sm text-red-400 block";
            } finally {
                submitBtn.textContent = "Send to FRIDAY";
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
